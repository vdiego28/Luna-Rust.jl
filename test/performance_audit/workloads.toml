schema_version = 1
source_of_truth = "src/RK45.jl RustNativeStepper NativeIneligible guards at Amalthea 73e32dcf45d93f11136d419faeae3b3641c9577d"
upstream_commit = "0a52ffbba6d5dd6820bb3dc3c300b8b38d724214"
size_policy = "Small exposes fixed overhead, medium is representative, large stresses throughput. Requested construction parameters are frozen below; realized FFT/grid and field dimensions for all 147 cells are frozen in results/fixture-shapes.jsonl."
realized_shape_inventory = "results/fixture-shapes.jsonl"

[measurement]
process_isolation = true
warmups = 2
minimum_samples = 10
maximum_samples = 30
relative_mad_target = 0.03
bootstrap_ci_half_width_target = 0.05
primary_threads = [1]
threaded_geometry_threads = [1, 2, 4, 6]
timings = ["setup", "field_sync", "fixed_rhs", "fixed_step", "adaptive_solve", "dense_output", "result_copy"]
counters = ["allocations", "peak_rss", "cycles", "instructions", "cache_misses", "branch_misses"]

# `upstream`: required = known public equivalent; probe = API/semantic parity
# must be established by the fixture checkpoint; unavailable = fork-only.

